# Deployed to the Scaleway instance by `.github/workflows/deploy-scaleway.yml`. `app` and
# `runner` have no published port - they're only reachable from `caddy` (and each other) over
# the compose network, so the only way in from outside is through Caddy's TLS-terminated 80/443.
services:
  app:
    image: ghcr.io/energieid/cofy-api/management:latest
    container_name: cofy-management
    restart: unless-stopped
    env_file: .env
    # The community configs are their own volume, so they can live elsewhere than the rest of the data.
    volumes:
      - /data/management:/data
      - /data/communities:/communities
    expose:
      - "8080"

  # Serves every community's API from its settings, which it only reads.
  runner:
    image: ghcr.io/energieid/cofy-api/runner:latest
    container_name: cofy-runner
    restart: unless-stopped
    environment:
      # Caddy strips this prefix; told it, the communities' API docs point at where they really are.
      UVICORN_ROOT_PATH: /communities
    volumes:
      - /data/communities:/communities:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: cofy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - runner

volumes:
  # Let's Encrypt certificates and Caddy's own state - must survive a redeploy, or every
  # `docker compose up` would re-issue a certificate and risk Let's Encrypt's rate limits.
  caddy_data:
  caddy_config:
