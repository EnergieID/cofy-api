type: cofy_api
debug_mode: true

auth:
  type: token
  tokens:
    ${COFY_API_TOKEN}:
      name: Demo User

modules:
  - type: tariff
    name: entsoe
    source:
      # caches in chunks of a day; max_age defaults to the wrapped source's (1 hour for ENTSO-E)
      type: cached
      source:
        type: entsoe_day_ahead
        api_key: ${ENTSOE_API_KEY}

  - type: tariff
    name: kiwatt
    source:
      type: cached
      source:
        type: entsoe_day_ahead
        country_code: NL
        api_key: ${ENTSOE_API_KEY}
    formats:
      - type: kiwatt

  - type: tariff
    name: dynamic
    description: Our dynamic tariff tracking the Belpex.
    source:
      type: energy_cost
      # see https://github.com/EnergieID/energy-cost for more details on the tariff configuration format
      tariff:
        - start: 2024-01-01T00:00:00+01:00
          consumption:
            constant_cost: 10.0
            variable_costs:
              - index: Belpex15min
                scalar: 1.05
          injection:
            constant_cost: 14.56
            variable_costs:
              - index: Belpex15min
                scalar: -0.9876
        - start: 2026-01-01T00:00:00+01:00
          consumption:
            constant_cost: 12.0
            variable_costs:
              - index: Belpex15min
                scalar: 1.10
          injection:
            constant_cost: 14.56
            variable_costs:
              - index: Belpex15min
                scalar: -0.9876

  - type: billing

  - type: production
    name: wind
    source:
      type: energyid_production
      api_key: ${ENERGY_ID_API_KEY}
      record_id: ${ENERGY_ID_RECORD_ID}

  - type: directive
    name: entsoe
    description: A directive module based on the entsoe day-ahead prices, with custom boundaries.
    source:
      type: directive
      source:
        type: cached
        source:
          type: entsoe_day_ahead
          api_key: ${ENTSOE_API_KEY}
      boundaries: [0, 10, 25, 50]
      reverse: true
    formats:
      - type: directive

  - type: directive
    name: deltawind
    description: Simultaneity directive for the Deltawind pilot, based on ACC forecasts. Low simultaneity encourages consumption.
    source:
      type: directive
      # simultaneity is total consumption as a percentage of total production; 80-120% is neutral.
      # The outer boundaries are placeholders until the pilot partners settle the policy.
      boundaries: [60, 80, 120, 140]
      reverse: true
      source:
        type: simultaneity
        sources:
          # a member is consuming or producing depending on the sign of its forecast.
          # further members reuse the credentials with `credentials: *acc_credentials`.
          - type: cached
            max_age: PT15M
            source:
              type: acc_forecast
              ean: '${ACC_EAN_1}'
              credentials: &acc_credentials '${ACC_CREDENTIALS}'
    formats:
      - type: directive
