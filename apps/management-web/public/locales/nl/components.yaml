# A deployment adding a language for the library's own strings, by serving a file at the path
# the library's `en` sits at. Deliberately incomplete: everything left out falls back to
# English key by key, so a translation can start small and grow.

communityList:
  title: Gemeenschappen
  description: Elke gemeenschap is één Cofy-configuratie.
  empty: Er zijn geen gemeenschappen geconfigureerd.
  columns:
    community: Gemeenschap
    slug: Naam
    modules: Modules

moduleList:
