name: test

on:
  workflow_call:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.21'
      - name: Install dependencies
        run: uv sync --project packages/api --group dev
      - name: Run API tests
        run: uv run --project packages/api --directory packages/api poe test --cov-report=lcov:../../cov-api.info --cov-report=xml:../../cov-api.xml
      - name: Code Coverage Annotation
        uses: ggilder/codecoverage@v1
        with:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          COVERAGE_FILE_PATH: "cov-api.info"
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: cov-api.xml

  management-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.21'
      - name: Install dependencies
        run: uv sync --project packages/management-api --group dev
      - name: Run management API tests
        run: uv run --project packages/management-api --directory packages/management-api poe test --cov-report=lcov:../../cov-management.info --cov-report=xml:../../cov-management.xml
      - name: Code Coverage Annotation
        uses: ggilder/codecoverage@v1
        with:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          COVERAGE_FILE_PATH: "cov-management.info"
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-management
          path: cov-management.xml

  coverage:
    runs-on: ubuntu-latest
    needs:
      - api-tests
      - management-tests
    steps:
      - name: Download API coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-api
      - name: Download management coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-management
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cov-api.xml,cov-management.xml
          badge: true
          hide_complexity: true
          hide_branch_rate: true
          fail_below_min: true
          format: markdown
          indicators: true
          thresholds: '100 100'

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            packages/frontend-sdk/package-lock.json
            packages/web-components/package-lock.json
            apps/management-web/package-lock.json
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'
      - name: Install frontend dependencies
        run: task install
      - name: Run frontend tests
        # Builds packages/frontend-sdk and packages/web-components first - apps/management-web
        # depends on their build output, not their sources.
        run: task test-frontend
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          # management-web is thin composition of these two libraries and has no coverage
          # floor of its own (see frontend-coverage below), so only their reports are here.
          path: |
            packages/frontend-sdk/coverage/cobertura-coverage.xml
            packages/web-components/coverage/cobertura-coverage.xml

  frontend-coverage:
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
    steps:
      - name: Download frontend coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: packages/frontend-sdk/coverage/cobertura-coverage.xml,packages/web-components/coverage/cobertura-coverage.xml
          badge: true
          hide_complexity: true
          hide_branch_rate: true
          fail_below_min: true
          format: markdown
          indicators: true
          # Lower than the backend's 100% - these are UI/browser packages with a lot of
          # template/render branches that aren't worth chasing line-for-line, but a floor still
          # catches an untested file slipping in, which is the point.
          thresholds: '80 80'
