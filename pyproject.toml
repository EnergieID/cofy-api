[project]
name = "cofy-cloud-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pre-commit>=4.2.0",
    "pyinstrument>=5.1.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[tool.poe.env]
PYTHONPYCACHEPREFIX = ".pycache"

[tool.poe.tasks]
# Package-local convenience wrappers
api-test = "uv run --project packages/api --directory packages/api poe test"
api-lint = "uv run --project packages/api --directory packages/api poe lint"
api-format = "uv run --project packages/api --directory packages/api poe format"
api-check = "uv run --project packages/api --directory packages/api poe check"

management-test = "uv run --project packages/management-api --directory packages/management-api poe test"
management-lint = "uv run --project packages/management-api --directory packages/management-api poe lint"
management-format = "uv run --project packages/management-api --directory packages/management-api poe format"
management-check = "uv run --project packages/management-api --directory packages/management-api poe check"

# Root aggregate convenience commands
test = ["api-test", "management-test"]
lint = ["api-lint", "management-lint"]
format = ["api-format", "management-format"]
check = ["api-check", "management-check"]

[tool.poe.tasks.demo]
cmd = "uv run --project packages/api fastapi dev demo/main.py"
envfile = ".env.local"
[tool.poe.tasks.from_settings]
cmd = "uv run --project packages/api fastapi dev demo/from_settings.py"
envfile = ".env.local"
[tool.poe.tasks.management]
cmd = "uv run --project packages/management-api --directory packages/management-api poe run"
[tool.poe.tasks.prod]
shell = """
docker build -t cofy-api -f Dockerfile .
docker run -p 8080:8080 --env-file .env.local cofy-api
"""
