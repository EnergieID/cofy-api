# Strings owned by @cofy/web-components.
#
# A deployment overrides any of these by serving its own file at the same path for its
# language; anything it leaves out falls back to this one, key by key.

communityList:
  title: Communities
  description: Each community is one Cofy configuration.
  empty: There are no communities you have access to. Ask an administrator to grant you access.
  columns:
    community: Community
    slug: Slug
    modules: Modules

moduleList:
  title: Modules
  description: What this community collects, computes and serves.
  add: Add module
  delete: Delete
  deleting: Deleting…
  empty: No modules are configured for this community.
  deleteConfirm: "Delete {{name}}? Its configuration cannot be recovered."
  columns:
    module: Module
    type: Type
    # Names the delete column for a screen reader; the header itself is visually empty.
    actions: Actions

resourceList:
  title: Resources
  description: Values configured once, and referenced by name from modules and other resources.
  add: Add resource
  delete: Delete
  deleting: Deleting…
  empty: No resources are configured for this community.
  deleteConfirm: "Delete {{name}}? Its value cannot be recovered."
  columns:
    resource: Resource
    kind: Kind
    description: Description
    # Names the delete column for a screen reader; the header itself is visually empty.
    actions: Actions

secretList:
  title: Secrets
  description: Credentials, given once and referenced by name. A secret's value is never shown again.
  add: Add secret
  delete: Delete
  deleting: Deleting…
  empty: No secrets are configured for this community.
  deleteConfirm: "Delete {{name}}? Its value cannot be recovered."
  columns:
    secret: Secret
    description: Description
    actions: Actions

secretDialog:
  title: New secret
  changeTitle: "Change {{name}}"
  name: Name
  nameHint: How the secret is referenced. No spaces, no special characters.
  description: Description
  value: Value
  valueHint: The current value is never shown; this replaces it.
  save: Save
  saving: Saving…
  cancel: Cancel

grantList:
  title: Access
  description: Who may manage this community. Access is granted by email and tied to the person's account when they first log in.
  add: Grant access
  revoke: Revoke
  revoking: Revoking…
  empty: Nobody has been granted access to this community yet.
  revokeConfirm: "Revoke the access of {{email}}?"
  bound: Account linked
  invited: Awaiting first login
  columns:
    email: Email
    role: Role
    status: Status
    actions: Actions

grantDialog:
  title: Grant access
  email: Email
  emailHint: The address the person logs in with. It must be verified at the identity provider.
  role: Role
  save: Grant
  saving: Granting…
  cancel: Cancel

roles:
  community_admin: Community admin

resourceCreate:
  title: Add resource
  submit: Create resource
  creating: Creating…
  cancel: Cancel

saveResource:
  title: Save as resource
  name: Name
  nameHint: How the resource is referenced. No spaces, no special characters.
  description: Description
  save: Save
  saving: Saving…
  cancel: Cancel

resourceEditor:
  title: Edit resource
  renamed: A resource's name is its identity and cannot be changed here — create a new resource instead.

editor:
  title: Edit module
  save: Save
  saving: Saving…
  discard: Discard
  saved: Saved
  unsaved: Unsaved changes
  unchanged: No changes
  renamed: A module's type and name are its identity and cannot be changed here — create a new module instead.

create:
  title: Add module
  submit: Create module
  creating: Creating…
  cancel: Cancel

form:
  add: Add
  create: Create
  remove: Remove
  key: Key
  choose: Choose
  type: Type
  moduleType: Module type
  resourceKind: Resource kind
  actions: Actions
  resource: Resource
  chooseResource: Choose a resource…
  noResources: "No fitting {{kind}} resources are configured yet."
  useResource: Use a resource
  saveAsResource: Save as resource
  specifyValue: Specify a value
  chooseSecret: Choose a secret…
  newSecret: New secret
  noSecrets: No secrets are configured yet
  chooseType: Choose a type…
  viewAsYaml: View as YAML
  viewAsForm: View as form
  issuesToggle_one: "{{count}} error blocks saving"
  issuesToggle_other: "{{count}} errors block saving"

settings:
  open: Settings
  logout: Log out
  theme:
    legend: Appearance
    names:
      # "System" keeps following the operating system, rather than copying it once.
      system: System
      light: Light
      dark: Dark
  language:
    legend: Language
    choose: Choose a language

# Keyed by the `code` the API puts on every problem document, so a failure reads in the
# reader's language. Anything without a translation here falls back to the server's own
# English `title` and `detail`, which is worse than a translation but never blank.
errors:
  unknown:
    title: Request failed
  not-authenticated:
    title: Not logged in
    detail: Log in again to continue.
  forbidden:
    title: No access
    detail: You don't have access to this. Ask an administrator to grant you access.
  resource-not-found:
    title: Not found
  resource-already-exists:
    title: Already exists
  resource-in-use:
    title: Still in use
  precondition-failed:
    title: Changed since you loaded it
  validation-failed:
    title: Some fields need attention
    detail: The values below could not be accepted.
  internal-error:
    title: Something went wrong

  # Keyed by pydantic's own code for a field failure. Unknown codes fall back to the English
  # message pydantic produced, so a new one degrades rather than disappearing.
  validation:
    missing: This field is required.
    string_type: This must be text.
    int_type: This must be a whole number.
    float_type: This must be a number.
    bool_type: This must be true or false.
    literal_error: This is not one of the allowed values.
    union_tag_invalid: This type is not one of the allowed types.
    string_pattern_mismatch: This is not in the expected format.
    value_error: This value could not be accepted.
